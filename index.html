<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reino Pixel Extremo Mobile</title>
  <link rel="stylesheet" href="style.css?v=120">
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <span class="kicker">Arcade RPG mobile</span>
        <h1>Reino Pixel Extremo</h1>
      </div>
      <div class="meta">
        <span id="stageLabel">Fase 1</span>
        <span id="walletLabel">0 moedas</span>
        <span id="heroLabel">Otavio</span>
      </div>
    </section>

    <section class="screen">
      <canvas id="game" width="960" height="540" aria-label="Jogo Reino Pixel Extremo"></canvas>
      <div class="quickbar">
        <button id="startBtn" type="button">Start</button>
        <button id="pauseBtn" type="button">Pausar</button>
        <button id="stopBtn" type="button">Stop</button>
        <button id="shopBtn" type="button">Loja</button>
      </div>
    </section>

    <section class="mobile-pad" aria-label="Controles para celular">
      <div class="move-pad">
        <button class="control" data-hold="left" aria-label="Esquerda">◀</button>
        <button class="control" data-hold="down" aria-label="Abaixar">▼</button>
        <button class="control" data-hold="right" aria-label="Direita">▶</button>
      </div>
      <div class="action-pad">
        <button class="control jump" data-tap="jump">Pular</button>
        <button class="control attack" data-tap="attack">Ataque</button>
        <button class="control power" data-tap="power">Poder</button>
      </div>
    </section>

    <section class="dashboard">
      <article class="panel">
        <div class="panel-head">
          <span>Personagens com poder</span>
          <strong id="countHeroes">0</strong>
        </div>
        <div id="heroGrid" class="hero-grid"></div>
      </article>

      <article class="panel shop-panel" id="shopPanel">
        <div class="panel-head">
          <span>Loja medieval</span>
          <strong>Itens usaveis</strong>
        </div>
        <div id="shopGrid" class="shop-grid"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <span>Campanha</span>
          <strong id="difficultyLabel">Dificil</strong>
        </div>
        <ol id="stageList" class="stage-list"></ol>
      </article>
    </section>
  </main>

  <script src="script.js?v=120"></script>
</body>
</html>
